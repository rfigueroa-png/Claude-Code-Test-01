const LS_KEY = "bravia-ag8-avancement-v1";

function lsRead() { try { return JSON.parse(localStorage.getItem(LS_KEY) || "{}"); } catch (e) { return {}; } }

(function boot() { const s = lsRead(); Object.assign(state, { done: s.done || {}, notes: s.notes || {}, equip: s.equip || {}, idx: s.idx || 0, essentiel: !!s.essentiel }); })();

function applies(s) {
  if (!s.si) return true;
  return s.si.split("|").some(c => c.startsWith("!") ? !state.equip[c.slice(1)] : !!state.equip[c]);
}
function mine() { return STEPS.filter(applies); }

function today() { const d = new Date(); return String(d.getDate()).padStart(2, "0") + "/" + String(d.getMonth() + 1).padStart(2, "0") + "/" + d.getFullYear(); }

const pending = new Map();
async function persist(id) {
  lsWrite();
  if (!db) return;
  if (pending.get(id)) { pending.set(id, "again"); return; }
  pending.set(id, "busy");
  try {
    do {
      pending.set(id, "busy");
      await db.doc("avancement/" + id).set({ fait: !!state.done[id], le: state.done[id] || "", note: state.notes[id] || "" });
    } while (pending.get(id) === "again");
    setSave("Avancement enregistré");
  } catch (e) {

  } finally { pending.delete(id); }
}
function setSave(t) { document.querySelectorAll(".save").forEach(el => el.textContent = t); }
let equipBusy = false, equipAgain = false;
async function persistEquip() {
  lsWrite();
  if (!db) return;
  if (equipBusy) { equipAgain = true; return; }
  equipBusy = true;
  try { do { equipAgain = false; await db.doc("profil/installation").set({ ...state.equip }); } while (equipAgain); }
  catch (e) { setSave("Avancement gardé sur cet appareil seulement"); }

const KEYS = ["ACTION MENU", "HOME", "INPUT", "HELP", "POWER"];
function el(tag, attrs, ...kids) {

  for (const k in (attrs || {})) {
    if (k === "class") n.className = attrs[k];
    else if (k === "text") n.textContent = attrs[k];
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), attrs[k]);
    else n.setAttribute(k, attrs[k]);

  kids.flat().forEach(c => c != null && n.append(c.nodeType ? c : document.createTextNode(c)));
  return n;
}
function crumbs(chemin) {

  const box = el("div", { class: "crumbs" });
  parts.forEach((p, i) => {
    if (i) box.append(el("span", { class: "sep", "aria-hidden": "true", text: "›" }));
    const k = KEYS.find(k => p === k || p.startsWith(k + " ") || p.startsWith(k + " "));
    if (k) {
      box.append(el("span", { class: "key", title: "Touche de la télécommande", text: k }));
      const rest = p.slice(k.length).trim();
      if (rest) box.append(el("span", { class: "c", text: rest }));
    } else box.append(el("span", { class: "c", text: p }));
  });
  return box;
}
function visible() { return mine().filter(s => (!state.essentiel || s.priorite === "1") && (!state.section || s.section === state.section)); }
function sections() { return [...new Set(mine().map(s => s.section))]; }
const PRIO = { "1": "Essentiel", "2": "Utile", "3": "Confort" };

function renderEquip(root) {

  const wrap = el("div", { class: "chips" });
  EQUIP.forEach(q => {

    cb.checked = !!state.equip[q.k];

function renderProgress() {

  const pct = n ? Math.round(d * 100 / n) : 0;

  document.getElementById("meter").setAttribute("aria-valuenow", pct);
}

      if (!doc.exists || equipBusy) return;
      const v = doc.data() || {};
      const next = {}; EQUIP.forEach(q => { if (v[q.k]) next[q.k] = true; });
      if (JSON.stringify(next) === JSON.stringify(Object.fromEntries(Object.entries(state.equip).filter(([, x]) => x)))) return;
      state.equip = next; lsWrite(); render();
    }, () => {});
  } catch (e) {}
})();
</script>
